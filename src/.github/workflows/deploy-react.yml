name: Deploy React to VPS

on:
  push:
    branches:
      - main   # deploy only when main is updated

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Node (for build)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # match your local version

      # 3. Install dependencies & build
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # 4. Setup SSH agent
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 5. Deploy /build to VPS
      - name: Deploy to VPS
        run: |
          rsync -avz --delete build/ username@VPS_IP:/var/www/html/react-app/
